apiVersion: apps/v1
kind: StatefulSet
metadata:
    labels:
      app: darius
    # name: statefulset-darius-puma
    name: statefulset-darius-small
    namespace: imsb
spec:
    serviceName: darius
    replicas: 1
    selector:
      matchLabels:
        app: darius
    template:
      metadata:
        labels:
          app: darius
      spec:
        volumes:
        - name: volume-poweredge
          persistentVolumeClaim:
            claimName: pvc-imsb-bonn-pe940
        - name: volume-deltabonn-6
          persistentVolumeClaim:
            claimName: pvc-deltabonn-6
        - name: volume-epyc
          persistentVolumeClaim:
            claimName: pvc-imsb-bonn-epyc
        - name: darius-fc
          persistentVolumeClaim:
            claimName: pvc-fc-darius
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        containers:
        - securityContext: {}
          command:
          - sleep
          - infinity
          image: human0815/cuda-conda:latest
          imagePullPolicy: Always
          name: darius
          resources:
            limits:
              memory: 128Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "64"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
          - mountPath: /poweredge
            name: volume-poweredge
            subPath: .
          - mountPath: /deltabonn-6
            name: volume-deltabonn-6
            subPath: .
          - mountPath: /epyc/projects/dschaub
            name: volume-deltabonn-6
            subPath: dschaub
          - mountPath: /epyc/projects/dschaub/method-projects
            name: darius-fc
          - mountPath: /bonn-epyc
            name: volume-epyc
          - mountPath: /dev/shm
            name: dshm
        dnsPolicy: ClusterFirst
        enableServiceLinks: true
        preemptionPolicy: PreemptLowerPriority
        priority: 0
        # Optional GPU pin (replace nodeSelector below with a mapping):
        # nodeSelector: {}
        nodeSelector:
          kubernetes.io/hostname: lion
          # kubernetes.io/hostname: puma
          # nvidia.com/gpu.product: NVIDIA-A100-SXM4-40GB
          # nvidia.com/gpu.product: NVIDIA-H100-PCIe

        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30 
