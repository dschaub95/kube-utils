name: docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push (use a test tag before replacing latest)
        default: latest
  # Merges to main publish latest; pull requests only build the image to check it.
  push:
    branches: [main]
    paths:
      - docker/default/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - docker/default/**
      - .github/workflows/docker.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: human0815
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: docker/default
          file: docker/default/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: human0815/cuda-conda:${{ inputs.tag || 'latest' }}
